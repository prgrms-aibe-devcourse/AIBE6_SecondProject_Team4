spring:
  application:
    name: back

  profiles:
    active: prod
    include: secret

  output:
    ansi:
      enabled: always

  datasource:
    hikari:
      auto-commit: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

springdoc:
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
    com.fitmate: DEBUG

file:
  upload-dir: ./uploads

gemini:
  model: gemini-3.1-flash-lite-preview
  candidate-limit: 5
  timeout-seconds: 5

custom:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
